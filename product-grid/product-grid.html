<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Thẻ Sản Phẩm Co Giãn Linh Hoạt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Danh Sách Sản Phẩm Nổi Bật</h2>
    
    <!-- Lưới danh sách sản phẩm Flexbox -->
    <div class="product-grid">
      <div class="product-card">
        <h4>Sản phẩm 1</h4>
        <p class="price">500.000 đ</p>
      </div>
      
      <div class="product-card">
        <h4>Sản phẩm 2</h4>
        <p class="price">750.000 đ</p>
      </div>
      
      <div class="product-card">
        <h4>Sản phẩm 3</h4>
        <p class="price">1.200.000 đ</p>
      </div>
      
      <div class="product-card">
        <h4>Sản phẩm 4</h4>
        <p class="price">320.000 đ</p>
      </div>
    </div>
  </div>

</body>
</html>
